services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: https://${HUB_DOMAIN:?Set HUB_DOMAIN to your hostname}
      TRUST_PROXY: '1'
    volumes:
      - hub-data:/data
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      HUB_DOMAIN: ${HUB_DOMAIN:?Set HUB_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
volumes:
  hub-data:
  caddy-data:
  caddy-config:
